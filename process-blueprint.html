<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>نقشه‌ی فرایندسازی</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Vazirmatn:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600;700&display=swap');

:root{
  --bg: #0F2A44;
  --bg2: #0B2138;
  --grid: rgba(234,246,255,0.06);
  --paper: #14314F;
  --ink: #EAF6FF;
  --ink-soft: #9FC1DB;
  --line: #2B4E6E;
  --cyan: #6FD3D9;
  --amber: #E0A458;
  --green: #5FBF8E;
  --red: #E0716B;
  --shadow: rgba(0,0,0,0.35);
}

*{box-sizing:border-box;}
body{
  margin:0;
  background:
    linear-gradient(var(--grid) 1px, transparent 1px) 0 0 / 24px 24px,
    linear-gradient(90deg, var(--grid) 1px, transparent 1px) 0 0 / 24px 24px,
    linear-gradient(180deg, var(--bg) 0%, var(--bg2) 100%);
  color:var(--ink);
  font-family:'Vazirmatn', sans-serif;
  min-height:100vh;
  padding:26px 16px 70px;
}

.wrap{max-width:1040px;margin:0 auto;}

/* ---------- header ---------- */
.header{
  border:1.4px solid var(--cyan);
  border-radius:8px;
  padding:20px 24px;
  display:flex;justify-content:space-between;align-items:center;flex-wrap:wrap;gap:14px;
  position:relative;
  background:rgba(20,49,79,0.5);
}
.header-title{font-weight:800;font-size:18px;letter-spacing:0.5px;}
.header-sub{font-family:'JetBrains Mono',monospace;font-size:10.5px;color:var(--ink-soft);letter-spacing:1.5px;text-transform:uppercase;margin-top:4px;}
.header-stats{display:flex;gap:22px;}
.stat{text-align:center;}
.stat-num{font-family:'JetBrains Mono',monospace;font-size:22px;font-weight:700;color:var(--cyan);}
.stat-label{font-size:10px;color:var(--ink-soft);letter-spacing:1px;}

/* ---------- add company ---------- */
.add-company{
  display:flex;gap:8px;margin:18px 0;flex-wrap:wrap;
  border:1px dashed var(--line);border-radius:8px;padding:14px;
}
.add-company input, .add-company select{
  border:1px solid var(--line);border-radius:6px;background:var(--paper);color:var(--ink);
  padding:8px 12px;font-family:inherit;font-size:13px;
}
.add-company input{flex:1;min-width:160px;}
.add-company button{
  border:1px solid var(--cyan);background:var(--cyan);color:#062333;font-weight:700;
  border-radius:6px;padding:8px 16px;font-family:inherit;font-size:13px;cursor:pointer;
}
.add-company button:hover{opacity:0.88;}

/* ---------- company card ---------- */
.company{
  border:1.2px solid var(--line);border-radius:10px;margin-bottom:16px;
  background:rgba(20,49,79,0.45);overflow:hidden;
}
.company-head{
  display:flex;justify-content:space-between;align-items:center;
  padding:14px 18px;border-bottom:1px solid var(--line);cursor:pointer;
  background:rgba(15,42,68,0.6);
}
.company-name-wrap{display:flex;align-items:center;gap:10px;}
.company-name{font-weight:700;font-size:15px;}
.company-type{
  font-family:'JetBrains Mono',monospace;font-size:9.5px;color:var(--ink-soft);
  border:1px solid var(--line);border-radius:4px;padding:2px 7px;
}
.company-progress-wrap{display:flex;align-items:center;gap:10px;}
.progress-bar{width:120px;height:8px;background:var(--bg2);border-radius:4px;overflow:hidden;}
.progress-fill{height:100%;background:linear-gradient(90deg, var(--amber), var(--green));}
.progress-pct{font-family:'JetBrains Mono',monospace;font-size:11px;color:var(--ink-soft);width:34px;}
.company-del{background:none;border:none;color:var(--red);cursor:pointer;font-size:13px;opacity:0.7;margin-right:6px;}
.company-del:hover{opacity:1;}
.chevron{font-size:11px;color:var(--ink-soft);transition:transform 0.2s;}
.chevron.open{transform:rotate(90deg);}

.company-body{padding:14px 18px 16px;display:none;}
.company-body.open{display:block;}

/* ---------- process rows ---------- */
.proc-table{width:100%;border-collapse:collapse;}
.proc-row{border-bottom:1px solid var(--line);}
.proc-row:last-child{border-bottom:none;}
.proc-cell{padding:8px 6px;vertical-align:middle;font-size:12.5px;}
.proc-name{width:100%;}
.proc-name input{
  width:100%;background:transparent;border:none;color:var(--ink);font-family:inherit;font-size:13px;
  padding:4px 2px;border-bottom:1px dotted transparent;
}
.proc-name input:focus{outline:none;border-bottom:1px dotted var(--cyan);}
.proc-status select{
  background:var(--bg2);color:var(--ink);border:1px solid var(--line);border-radius:5px;
  padding:5px 8px;font-family:inherit;font-size:11.5px;
}
.proc-owner input{
  background:var(--bg2);border:1px solid var(--line);border-radius:5px;color:var(--ink);
  padding:5px 8px;font-family:inherit;font-size:11.5px;width:90px;
}
.proc-del{background:none;border:none;color:var(--red);cursor:pointer;opacity:0.6;font-size:12px;}
.proc-del:hover{opacity:1;}
.status-badge{
  display:inline-block;width:8px;height:8px;border-radius:50%;margin-left:5px;
}
.status-badge.notstarted{background:var(--ink-soft);}
.status-badge.drafting{background:var(--amber);}
.status-badge.review{background:var(--cyan);}
.status-badge.active{background:var(--green);}

.add-proc-row{display:flex;gap:6px;margin-top:10px;}
.add-proc-row input{
  flex:1;border:1px solid var(--line);border-radius:6px;background:var(--bg2);color:var(--ink);
  padding:7px 10px;font-family:inherit;font-size:12.5px;
}
.add-proc-row button{
  border:1px solid var(--line);background:var(--paper);color:var(--ink);
  border-radius:6px;padding:7px 14px;font-family:inherit;font-size:12.5px;cursor:pointer;
}
.add-proc-row button:hover{border-color:var(--cyan);color:var(--cyan);}

.company-note{margin-top:12px;}
.company-note textarea{
  width:100%;min-height:50px;background:var(--bg2);border:1px solid var(--line);border-radius:6px;
  color:var(--ink);padding:9px;font-family:inherit;font-size:12px;resize:vertical;
}
.company-note-label{font-size:11px;color:var(--ink-soft);margin-bottom:5px;}

.empty-hint{text-align:center;color:var(--ink-soft);font-size:13px;padding:30px 10px;}

.actions{display:flex;gap:10px;margin-top:20px;flex-wrap:wrap;}
.btn{border:none;border-radius:7px;padding:10px 18px;font-family:inherit;font-size:12.5px;cursor:pointer;font-weight:600;}
.btn.ghost{background:transparent;border:1px solid var(--cyan);color:var(--cyan);}
.btn.ghost:hover{background:var(--cyan);color:#062333;}

.toast{
  position:fixed;bottom:20px;left:50%;transform:translateX(-50%);
  background:var(--paper);border:1px solid var(--cyan);color:var(--ink);padding:10px 20px;border-radius:8px;
  font-size:13px;opacity:0;pointer-events:none;transition:opacity 0.25s;font-family:'JetBrains Mono',monospace;
}
.toast.show{opacity:1;}

.footnote{text-align:center;font-size:11px;color:var(--ink-soft);margin-top:20px;font-family:'JetBrains Mono',monospace;}
</style>
</head>
<body>

<div class="wrap">
  <div class="header">
    <div>
      <div class="header-title">نقشه‌ی فرایندسازی و SOP</div>
      <div class="header-sub">سیستماتیک‌سازی مجموعه — از دخالت روزانه به تفویض</div>
    </div>
    <div class="header-stats">
      <div class="stat"><div class="stat-num" id="statCompanies">0</div><div class="stat-label">شرکت</div></div>
      <div class="stat"><div class="stat-num" id="statProcesses">0</div><div class="stat-label">فرایند</div></div>
      <div class="stat"><div class="stat-num" id="statActive">0٪</div><div class="stat-label">تفویض‌شده</div></div>
    </div>
  </div>

  <div class="add-company">
    <input type="text" id="newCompanyName" placeholder="نام شرکت جدید...">
    <select id="newCompanyType">
      <option value="حقوقی">حقوقی</option>
      <option value="حقیقی">حقیقی</option>
    </select>
    <button id="addCompanyBtn">افزودن شرکت</button>
  </div>

  <div id="companies"></div>
  <div id="emptyHint" class="empty-hint" style="display:none;">هنوز شرکتی اضافه نکردی — از بالا شروع کن.</div>

  <div class="actions">
    <button class="btn ghost" id="exportBtn">دانلود فایل پشتیبان</button>
    <button class="btn ghost" id="importBtn">بارگذاری فایل پشتیبان</button>
    <input type="file" id="importFile" accept="application/json" style="display:none;">
  </div>

  <div class="footnote">هر فرایند: مستندسازی‌نشده ← در حال نگارش ← در حال بازبینی ← تفویض‌شده و فعال</div>
</div>

<div class="toast" id="toast"></div>

<script>
const STATUS_OPTIONS = [
  {v:'notstarted', label:'مستندسازی نشده'},
  {v:'drafting', label:'در حال نگارش'},
  {v:'review', label:'در حال بازبینی'},
  {v:'active', label:'تفویض‌شده و فعال'}
];

const DEFAULT_PROCESSES = ['خرید و تدارکات','ترخیص گمرکی','انبارداری','فروش و بازاریابی','مالی و حسابداری'];

let state = { companies: [] };

function uid(){ return Math.random().toString(36).slice(2,9); }

function toast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2200);
}

function hasCloudStorage(){
  return typeof window !== 'undefined' && !!window.storage && typeof window.storage.get === 'function';
}
function withTimeout(promise, ms){
  return Promise.race([promise, new Promise((_,rej)=>setTimeout(()=>rej(new Error('timeout')), ms))]);
}
async function storageGetRaw(key){
  if(hasCloudStorage()){
    const r = await withTimeout(window.storage.get(key,false), 4000);
    return r.value;
  }
  const v = localStorage.getItem('process-blueprint:'+key);
  if(v===null) throw new Error('missing');
  return v;
}
async function storageSetRaw(key, value){
  try{
    if(hasCloudStorage()){
      await withTimeout(window.storage.set(key,value,false), 4000);
    } else {
      localStorage.setItem('process-blueprint:'+key, value);
    }
    return true;
  }catch(e){ console.error('save failed', e); return false; }
}

async function loadState(){
  try{
    const raw = await storageGetRaw('state');
    state = JSON.parse(raw);
  }catch(e){
    state = { companies: [] };
  }
}
async function saveState(){
  return await storageSetRaw('state', JSON.stringify(state));
}

function computeCompanyProgress(company){
  const total = company.processes.length;
  if(total===0) return 0;
  const active = company.processes.filter(p=>p.status==='active').length;
  return Math.round((active/total)*100);
}

function renderStats(){
  const totalCompanies = state.companies.length;
  let totalProc = 0, totalActive = 0;
  state.companies.forEach(c=>{
    totalProc += c.processes.length;
    totalActive += c.processes.filter(p=>p.status==='active').length;
  });
  document.getElementById('statCompanies').textContent = totalCompanies;
  document.getElementById('statProcesses').textContent = totalProc;
  document.getElementById('statActive').textContent = totalProc>0 ? Math.round((totalActive/totalProc)*100)+'٪' : '0٪';
}

function render(){
  const wrap = document.getElementById('companies');
  wrap.innerHTML = '';
  document.getElementById('emptyHint').style.display = state.companies.length===0 ? 'block' : 'none';

  state.companies.forEach(company=>{
    const pct = computeCompanyProgress(company);
    const card = document.createElement('div');
    card.className = 'company';

    const head = document.createElement('div');
    head.className = 'company-head';
    head.innerHTML = `
      <div class="company-name-wrap">
        <span class="chevron ${company._open?'open':''}">◀</span>
        <span class="company-name">${company.name}</span>
        <span class="company-type">${company.type}</span>
      </div>
      <div class="company-progress-wrap">
        <div class="progress-bar"><div class="progress-fill" style="width:${pct}%"></div></div>
        <span class="progress-pct">${pct}٪</span>
        <button class="company-del" data-id="${company.id}">حذف</button>
      </div>
    `;
    head.addEventListener('click', (e)=>{
      if(e.target.classList.contains('company-del')) return;
      company._open = !company._open;
      render();
    });
    head.querySelector('.company-del').addEventListener('click', (e)=>{
      e.stopPropagation();
      state.companies = state.companies.filter(c=>c.id!==company.id);
      saveState(); render();
    });
    card.appendChild(head);

    const body = document.createElement('div');
    body.className = 'company-body ' + (company._open ? 'open' : '');

    const table = document.createElement('table');
    table.className = 'proc-table';
    company.processes.forEach(proc=>{
      const row = document.createElement('tr');
      row.className = 'proc-row';
      const statusOpts = STATUS_OPTIONS.map(o=>`<option value="${o.v}" ${o.v===proc.status?'selected':''}>${o.label}</option>`).join('');
      row.innerHTML = `
        <td class="proc-cell proc-name"><input type="text" value="${proc.name}" data-id="${proc.id}" class="proc-name-input"></td>
        <td class="proc-cell proc-status"><span class="status-badge ${proc.status}"></span><select data-id="${proc.id}" class="proc-status-select">${statusOpts}</select></td>
        <td class="proc-cell proc-owner"><input type="text" value="${proc.owner||''}" placeholder="مسئول" data-id="${proc.id}" class="proc-owner-input"></td>
        <td class="proc-cell"><button class="proc-del" data-id="${proc.id}">حذف</button></td>
      `;
      row.querySelector('.proc-name-input').addEventListener('input', (e)=>{
        proc.name = e.target.value; saveState();
      });
      row.querySelector('.proc-status-select').addEventListener('change', (e)=>{
        proc.status = e.target.value; saveState(); render();
      });
      row.querySelector('.proc-owner-input').addEventListener('input', (e)=>{
        proc.owner = e.target.value; saveState();
      });
      row.querySelector('.proc-del').addEventListener('click', ()=>{
        company.processes = company.processes.filter(p=>p.id!==proc.id);
        saveState(); render();
      });
      table.appendChild(row);
    });
    body.appendChild(table);

    const addRow = document.createElement('div');
    addRow.className = 'add-proc-row';
    addRow.innerHTML = `<input type="text" placeholder="فرایند جدید (مثلاً: مدیریت انبار)..."><button>افزودن فرایند</button>`;
    const input = addRow.querySelector('input');
    const btn = addRow.querySelector('button');
    const addProc = ()=>{
      const val = input.value.trim();
      if(!val) return;
      company.processes.push({id:uid(), name:val, status:'notstarted', owner:''});
      input.value='';
      saveState(); render();
    };
    btn.addEventListener('click', addProc);
    input.addEventListener('keydown', (e)=>{ if(e.key==='Enter') addProc(); });
    body.appendChild(addRow);

    const noteWrap = document.createElement('div');
    noteWrap.className = 'company-note';
    noteWrap.innerHTML = `<div class="company-note-label">یادداشت / گام بعدی</div><textarea placeholder="مثلاً: هفته‌ی بعد جلسه با مسئول انبار برای تدوین SOP...">${company.note||''}</textarea>`;
    noteWrap.querySelector('textarea').addEventListener('input', (e)=>{
      company.note = e.target.value; saveState();
    });
    body.appendChild(noteWrap);

    card.appendChild(body);
    wrap.appendChild(card);
  });

  renderStats();
}

async function listStateKeys(){ return ['state']; }

async function exportBackup(){
  const backup = { exportedAt: new Date().toISOString(), state };
  const blob = new Blob([JSON.stringify(backup, null, 2)], {type:'application/json'});
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'process-blueprint-backup-' + new Date().toISOString().slice(0,10) + '.json';
  document.body.appendChild(a); a.click(); a.remove();
  URL.revokeObjectURL(url);
  toast('فایل پشتیبان دانلود شد');
}

async function importBackup(file){
  try{
    const text = await file.text();
    const backup = JSON.parse(text);
    if(backup.state){
      state = backup.state;
      await saveState();
      render();
      toast('پشتیبان بارگذاری شد ✓');
    }
  }catch(e){
    console.error(e);
    toast('فایل پشتیبان معتبر نبود');
  }
}

function attachListeners(){
  document.getElementById('addCompanyBtn').addEventListener('click', ()=>{
    const nameInput = document.getElementById('newCompanyName');
    const typeSelect = document.getElementById('newCompanyType');
    const name = nameInput.value.trim();
    if(!name) return;
    state.companies.push({
      id: uid(),
      name,
      type: typeSelect.value,
      note: '',
      _open: true,
      processes: DEFAULT_PROCESSES.map(p=>({id:uid(), name:p, status:'notstarted', owner:''}))
    });
    nameInput.value = '';
    saveState(); render();
  });
  document.getElementById('newCompanyName').addEventListener('keydown', (e)=>{
    if(e.key==='Enter') document.getElementById('addCompanyBtn').click();
  });

  document.getElementById('exportBtn').addEventListener('click', exportBackup);
  document.getElementById('importBtn').addEventListener('click', ()=> document.getElementById('importFile').click());
  document.getElementById('importFile').addEventListener('change', (e)=>{
    const file = e.target.files[0];
    if(file) importBackup(file);
    e.target.value = '';
  });
}

async function init(){
  render();
  attachListeners();
  try{
    await loadState();
    render();
  }catch(e){
    console.error('background load failed', e);
    toast('اتصال به حافظه برقرار نشد — نسخه‌ی موقت نمایش داده شد');
  }
}

init();
</script>
</body>
</html>
